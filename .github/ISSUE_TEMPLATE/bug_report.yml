name: Bug report
description: Report a problem with Vidyqor so we can fix it.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Vidyqor is at the **foundation / scaffold** stage — the functional modules are
        Planned and not yet implemented. Bugs are most likely in the scaffold, build
        configuration, documentation, or CI at this point. Please search existing issues
        first to avoid duplicates.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability (those follow SECURITY.md instead).
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including logs or error output.
    validations:
      required: false
  - type: input
    id: frappe-version
    attributes:
      label: Frappe version
      placeholder: "e.g. version-15"
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.6"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us understand the problem.
    validations:
      required: false
