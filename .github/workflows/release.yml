name: Release

on:
  push:
    tags:
      - "v*"

# Creating a GitHub release needs write access to repository contents only.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag and package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="$(python3 -c "import re; s=open('vidyqor/__init__.py').read(); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)[\"\\']', s).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG — package __version__: $VERSION"

      - name: Verify tag matches __version__
        run: |
          if [ "${{ steps.version.outputs.tag }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${{ steps.version.outputs.tag }} does not match package version v${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Verify CHANGELOG has an entry for this version
        run: |
          if ! grep -q "\[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build source and wheel distributions
        run: |
          pip install build
          python3 -m build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vidyqor ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: dist/*
